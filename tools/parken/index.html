<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkschein- & Parkplatz-Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
    <header class="bg-amber-600 text-white shadow-md py-6 px-4 text-center">
        <h1 class="text-2xl font-bold">🅿️ Parkschein- & Parkplatz-Timer</h1>
        <p class="text-sm opacity-90 mt-1">Parkzeit im Auge behalten und Strafzettel vermeiden</p>
    </header>
    <main class="flex-grow container mx-auto p-4 max-w-4xl space-y-6">
        <a href="../../index.html" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-xl text-xs font-semibold inline-block">← Zurück zur Startseite</a>
        <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4 text-center">
            <h2 class="text-lg font-bold">Parkzeit starten</h2>
            <p class="text-xs text-gray-600">Wie lange darf das Auto stehen?</p>
            <div class="flex justify-center gap-3">
                <button onclick="startTimer(30)" class="px-4 py-2 bg-amber-100 text-amber-800 font-bold rounded-xl">30 Min</button>
                <button onclick="startTimer(60)" class="px-4 py-2 bg-amber-100 text-amber-800 font-bold rounded-xl">1 Stunde</button>
                <button onclick="startTimer(120)" class="px-4 py-2 bg-amber-100 text-amber-800 font-bold rounded-xl">2 Stunden</button>
            </div>
            <div id="timerDisplay" class="text-3xl font-bold text-amber-600 mt-4">00:00:00</div>
        </div>
    </main>
    <script>
        let timerInterval;
        function startTimer(minutes) {
            clearInterval(timerInterval);
            let endTime = new Date().getTime() + minutes * 60000;
            timerInterval = setInterval(() => {
                let now = new Date().getTime();
                let distance = endTime - now;
                if (distance < 0) {
                    clearInterval(timerInterval);
                    document.getElementById("timerDisplay").innerText = "⏰ Parkzeit abgelaufen!";
                    if("Notification" in window && Notification.permission === "granted") {
                        new Notification("Park-Alarm", { body: "Die Parkzeit ist abgelaufen!" });
                    }
                    return;
                }
                let m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                let s = Math.floor((distance % (1000 * 60)) / 1000);
                document.getElementById("timerDisplay").innerText = `${m}m ${s}s verbleibend`;
            }, 1000);
        }
    </script>
</body>
</html>
