<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leih- & Verleih-Tracker Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF für PDF-Report -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md py-6 px-4 text-center">
        <h1 class="text-3xl font-bold">🤝 Leih- & Verleih-Tracker Pro</h1>
        <p class="text-sm opacity-90 mt-1">Behalte den Überblick, wer sich dein Zeug geliehen hat</p>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto p-4 max-w-5xl space-y-6">
        
        <!-- Navigation & Global Actions -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-3 bg-white p-4 rounded-2xl shadow-sm border">
            <a href="../../index.html" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-xl text-xs font-semibold">← Zurück zur Startseite</a>
            
            <div class="flex flex-wrap gap-2 w-full md:w-auto justify-end">
                <button onclick="exportPDF()" class="px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-xl text-xs font-bold shadow-sm">📄 PDF-Report</button>
                <button onclick="exportBackup()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-xl text-xs font-medium">💾 Backup</button>
                <label class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-xl text-xs font-medium cursor-pointer">
                    📂 Import <input type="file" accept=".json" onchange="importBackup(event)" class="hidden">
                </label>
            </div>
        </div>

        <!-- Dashboard Statistiken -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border flex items-center space-x-4">
                <div class="p-3 bg-indigo-50 text-indigo-700 rounded-xl font-bold">📦</div>
                <div><p class="text-xs text-gray-500">Aktiv verliehen</p><h3 id="statActive" class="text-lg font-bold">0</h3></div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border flex items-center space-x-4">
                <div class="p-3 bg-red-50 text-red-600 rounded-xl font-bold">⏰</div>
                <div><p class="text-xs text-gray-500">Überfällig (&gt; 30 Tage)</p><h3 id="statOverdue" class="text-lg font-bold">0</h3></div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border flex items-center space-x-4">
                <div class="p-3 bg-green-50 text-green-600 rounded-xl font-bold">✅</div>
                <div><p class="text-xs text-gray-500">Bereits zurückerhalten</p><h3 id="statReturned" class="text-lg font-bold">0</h3></div>
            </div>
        </div>

        <!-- Erfassung: Neuer Verleih -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-3">
            <h2 class="text-lg font-bold">➕ Gegenstand als verliehen eintragen</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <input type="text" id="itemTitle" placeholder="Gegenstand (z.B. Bohrhammer)" class="p-3 border rounded-xl text-sm">
                <input type="text" id="itemPerson" placeholder="An wen? (z.B. Nachbar Müller)" class="p-3 border rounded-xl text-sm">
                <input type="date" id="itemDate" class="p-3 border rounded-xl text-sm">
            </div>
            <input type="text" id="itemNote" placeholder="Notiz / Beschreibung (optional)" class="w-full p-3 border rounded-xl text-sm">
            <button onclick="saveItem()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl text-sm shadow-sm">Verleih speichern</button>
        </div>

        <!-- Verleih-Liste -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
            <h3 class="font-bold text-lg">📋 Aktuelle Verleih-Liste</h3>
            <div id="itemsList" class="space-y-3">
                <p class="text-sm text-gray-400 text-center py-4">Keine verliehenen Gegenstände erfasst.</p>
            </div>
        </div>
    </main>

    <!-- Script Logik -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('itemDate').valueAsDate = new Date();
            renderApp();
        });

        function getData() {
            try {
                return JSON.parse(localStorage.getItem('verleih_tracker_pro')) || { items: [] };
            } catch(e) {
                return { items: [] };
            }
        }

        function saveData(data) {
            localStorage.setItem('verleih_tracker_pro', JSON.stringify(data));
        }

        function saveItem() {
            const title = document.getElementById('itemTitle').value.trim();
            const person = document.getElementById('itemPerson').value.trim();
            const date = document.getElementById('itemDate').value;
            const note = document.getElementById('itemNote').value.trim();

            if (!title || !person || !date) return alert("Bitte Gegenstand, Person und Datum angeben!");

            let data = getData();
            data.items.push({ id: Date.now(), title, person, date, note, returned: false });
            saveData(data);

            document.getElementById('itemTitle').value = "";
            document.getElementById('itemPerson').value = "";
            document.getElementById('itemNote').value = "";
            document.getElementById('itemDate').valueAsDate = new Date();
            renderApp();
        }

        function toggleReturn(id) {
            let data = getData();
            let item = data.items.find(i => i.id === id);
            if (item) {
                item.returned = !item.returned;
                saveData(data);
                renderApp();
            }
        }

        function deleteItem(id) {
            if (!confirm("⚠️ Diesen Eintrag wirklich löschen?")) return;
            let data = getData();
            data.items = data.items.filter(i => i.id !== id);
            saveData(data);
            renderApp();
        }

        function renderApp() {
            let data = getData();
            const container = document.getElementById('itemsList');

            let activeCount = data.items.filter(i => !i.returned).length;
            let returnedCount = data.items.filter(i => i.returned).length;
            let overdueCount = 0;

            const today = new Date();

            if (data.items.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-400 text-center py-4">Keine verliehenen Gegenstände erfasst.</p>`;
            } else {
                container.innerHTML = data.items.map(i => {
                    let d = new Date(i.date);
                    let diff = Math.ceil((today - d) / (1000 * 60 * 60 * 24));
                    
                    let badge = "";
                    if (i.returned) {
                        badge = `<span class="text-[10px] bg-green-100 text-green-800 font-semibold px-2 py-0.5 rounded-full">✅ Zurückgegeben</span>`;
                    } else if (diff > 30) {
                        overdueCount++;
                        badge = `<span class="text-[10px] bg-red-100 text-red-800 font-semibold px-2 py-0.5 rounded-full">🔴 Überfällig (${diff} Tage)</span>`;
                    } else if (diff > 14) {
                        badge = `<span class="text-[10px] bg-amber-100 text-amber-800 font-semibold px-2 py-0.5 rounded-full">🟡 vor ${diff} Tagen</span>`;
                    } else {
                        badge = `<span class="text-[10px] bg-indigo-100 text-indigo-800 font-semibold px-2 py-0.5 rounded-full">🟢 vor ${diff} Tagen</span>`;
                    }

                    return `
                        <div class="p-4 bg-gray-50 border rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 ${i.returned ? 'opacity-60' : ''}">
                            <div>
                                <div class="flex items-center space-x-2 flex-wrap gap-1">
                                    <span class="text-xs font-bold text-gray-800">📦 ${i.title}</span>
                                    <span class="text-xs text-indigo-600 font-semibold">→ ${i.person}</span>
                                    ${badge}
                                </div>
                                <p class="text-xs text-gray-500 mt-1">Verliehen am: ${d.toLocaleDateString('de-DE')} ${i.note ? '| Notiz: ' + i.note : ''}</p>
                            </div>
                            <div class="flex items-center gap-2 self-end sm:self-center">
                                <button onclick="toggleReturn(${i.id})" class="px-3 py-1.5 ${i.returned ? 'bg-gray-200 text-gray-700' : 'bg-green-600 text-white'} rounded-xl text-xs font-semibold">${i.returned ? 'Wieder ausleihen' : 'Zurück erhalten'}</button>
                                <button onclick="deleteItem(${i.id})" class="px-2.5 py-1.5 bg-red-50 text-red-600 hover:bg-red-100 rounded-xl text-xs font-semibold">✕</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('statActive').innerText = activeCount;
            document.getElementById('statOverdue').innerText = overdueCount;
            document.getElementById('statReturned').innerText = returnedCount;
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let data = getData();

            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.text("Leih- & Verleih-Report", 14, 20);

            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text(`Erstellt am: ${new Date().toLocaleDateString('de-DE')}`, 14, 27);

            let y = 35;
            doc.setFont("helvetica", "bold");
            doc.text("Verleih-Historie:", 14, y);
            y += 7;

            doc.setFont("helvetica", "normal");
            data.items.forEach(i => {
                if (y > 270) { doc.addPage(); y = 20; }
                let status = i.returned ? "[ZURÜCK]" : "[AKTIV]";
                doc.text(`- ${status} ${i.title} an ${i.person} (seit ${new Date(i.date).toLocaleDateString('de-DE')})`, 14, y);
                y += 6;
            });

            doc.save("verleih-report.pdf");
        }

        function exportBackup() {
            let data = JSON.stringify(getData());
            let blob = new Blob([data], { type: 'application/json' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = `verleih-backup-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.items) {
                        saveData(parsed);
                        renderApp();
                        alert("Backup erfolgreich importiert!");
                    } else {
                        alert("Ungültiges Format.");
                    }
                } catch (err) {
                    alert("Fehler beim Lesen der Datei.");
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
