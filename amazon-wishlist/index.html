<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Helferlein · Amazon-Wünsche</title><style>body{font:16px system-ui;margin:0;background:#f4f7fb;color:#17253d}main{max-width:720px;margin:auto;padding:20px}section{background:white;border:1px solid #dfe6ef;border-radius:16px;padding:20px;margin:18px 0}input,button,select{font:inherit;padding:10px;border-radius:9px;box-sizing:border-box}input,select{width:100%;border:1px solid #b4c0d1;margin:5px 0 12px}button{border:0;background:#1465c8;color:white;cursor:pointer;margin:5px 5px 5px 0}.item{padding:15px 0;border-bottom:1px solid #ddd}a{color:#1457a3}</style></head><body><main><a href="../index.html">← Helferlein</a><h1>♡ Amazon-Wunschlisten</h1><p>Öffentliche Wünsche entdecken. Amazon-Partnerlinks können eine Provision ermöglichen.</p><p id="status" role="status" aria-live="polite"></p><section id="login"><h2>Anmelden / Registrieren</h2><label>E-Mail<input id="email" type="email"></label><label>Passwort<input id="password" type="password"></label><button id="signin">Anmelden</button><button id="signup">Registrieren</button></section><button id="logout" hidden>Abmelden</button><section id="editor" hidden><h2>Mein öffentliches Profil</h2><label>Benutzername<input id="handle" maxlength="30"></label><label>Anzeigename<input id="displayName" maxlength="80"></label><button id="saveProfile">Profil speichern</button><h2>Wunsch hinzufügen</h2><label>Amazon.de-Link<input id="url" type="url"></label><label>Produkttitel<input id="productTitle" maxlength="250"></label><label>Priorität<select id="priority"><option value="1">Sehr wichtig</option><option value="2" selected>Normal</option><option value="3">Irgendwann</option></select></label><button id="saveWish">Wunsch speichern</button></section><section><h2>Öffentlicher Wunsch-Feed</h2><div id="feed"></div><button id="more">Weitere Wünsche</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script type="module" src="./app.mjs"></script></body></html>
