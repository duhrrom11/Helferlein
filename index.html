    <!-- Script Logik -->
    <script>
        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme'] && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            loadStats();
        });

        function filterTools() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const cards = document.querySelectorAll('.tool-card');
            cards.forEach(card => {
                const name = card.getAttribute('data-name');
                if (name.includes(query) || card.innerText.toLowerCase().includes(query)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
        }

        function loadStats() {
            try {
                const setStat = (id, text) => {
                    const el = document.getElementById(id);
                    if (el) el.innerText = text;
                };

                // Intelligente Hilfsfunktion, die verschiedene Schlüssel und Datenstrukturen prüft
                const getCount = (keys) => {
                    for (let key of keys) {
                        try {
                            let val = localStorage.getItem(key);
                            if (val) {
                                let parsed = JSON.parse(val);
                                if (Array.isArray(parsed)) return parsed.length;
                                if (parsed && typeof parsed === 'object') {
                                    // Durchsuche gängige Untereigenschaften nach Arrays
                                    for (let prop of ['items', 'boxes', 'expenses', 'notes', 'vehicles', 'pets', 'readings', 'plants']) {
                                        if (Array.isArray(parsed[prop])) return parsed[prop].length;
                                    }
                                    return Object.keys(parsed).length;
                                }
                            }
                        } catch(e) {}
                    }
                    return 0;
                };

                // 1. Kassenbon
                setStat('stats-kassenbon', `${getCount(['kassenbon_data', 'kassenbon', 'belege', 'receipts'])} Belege gespeichert`);

                // 2. Kisten
                setStat('stats-kisten', `${getCount(['kisten_data', 'kisten', 'boxes', 'inventar'])} Kisten im Bestand`);

                // 3. WG-Kasse
                setStat('stats-wg-kasse', `${getCount(['wg_kasse_data', 'wg_kasse', 'expenses', 'haushalt'])} Ausgaben erfasst`);

                // 4. Notizen
                setStat('stats-notizen', `${getCount(['secure_notes', 'notes', 'notizen_data', 'notizen'])} Notizen gesichert`);

                // 5. KFZ
                setStat('stats-kfz', `${getCount(['kfz_pass', 'kfz_data', 'vehicles', 'autos'])} Fahrzeuge aktiv`);

                // 6. Haustier
                setStat('stats-haustier', `${getCount(['haustier_pass', 'haustier_data', 'pets', 'tiere'])} Haustiere erfasst`);

                // 7. Parken
                let parkData = null;
                for (let k of ['parken_data', 'parken', 'parking']) {
                    try { let v = localStorage.getItem(k); if (v) { parkData = JSON.parse(v); break; } } catch(e){}
                }
                let hasActivePark = parkData && (parkData.active || parkData.startTime || parkData.endTime);
                setStat('stats-parken', hasActivePark ? "Aktiver Park-Timer" : "Kein aktives Ticket");

                // 8. Verleih
                setStat('stats-verleih', `${getCount(['verleih_pass', 'verleih_data', 'verleih', 'items'])} Verleih-Objekte`);

                // 9. Pflanzen
                setStat('stats-pflanzen', `${getCount(['pflanzen_pass', 'pflanzen_data', 'pflanzen', 'plants'])} Pflanzen im Bestand`);

                // 10. Energie
                setStat('stats-energie', `${getCount(['energie_tracker_pro', 'energie_data', 'energie', 'readings'])} Ablesungen erfasst`);

            } catch(e) {
                console.log("Fehler beim Laden der Stats:", e);
            }
        }

        async function exportGlobalBackup() {
            try {
                let globalBackup = {};
                for (let i = 0; i < localStorage.length; i++) {
                    let key = localStorage.key(i);
                    globalBackup[key] = localStorage.getItem(key);
                }
                const jsonString = JSON.stringify(globalBackup);
                const blob = new Blob([jsonString], { type: 'application/json' });
                const fileName = `alltagshilfe-komplett-backup-${new Date().toISOString().split('T')[0]}.json`;
                const file = new File([blob], fileName, { type: 'application/json' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'Alltagshelferlein Backup',
                            text: 'Hier ist das komplette Backup deines Alltagshelferlein Hubs.'
                        });
                        return;
                    } catch (err) {
                        if (err.name === 'AbortError') return;
                    }
                }

                let url = URL.createObjectURL(blob);
                let a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                alert("Fehler beim Exportieren: " + e.message);
            }
        }

        function importGlobalBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    for (let key in parsed) {
                        localStorage.setItem(key, parsed[key]);
                    }
                    loadStats();
                    alert("Komplettes System-Backup erfolgreich eingespielt!");
                } catch (err) {
                    alert("Fehler beim Importieren der Backup-Datei.");
                }
            };
            reader.readAsText(file);
        }
    </script>
