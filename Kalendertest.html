<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helferlein - Kalender & Tool-Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-emerald-800 text-white shadow-lg py-6 px-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">📅 Helferlein Kalender- & Tool-Hub</h1>
                <p class="text-xs md:text-sm opacity-90 mt-1">Liest alle Termine, Fristen & To-Dos aus deiner Online-Datenbank aus</p>
            </div>
            <div class="flex flex-wrap gap-2 items-center">
                <button onclick="exportiereAlsICS()" class="px-3.5 py-2 bg-amber-500 hover:bg-amber-600 text-amber-950 rounded-xl text-xs font-bold shadow-sm transition-all">
                    📥 In Google Kalender importieren (.ics)
                </button>
                <button onclick="manuelleSynchronisation()" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all">
                    🔄 Laden
                </button>
                <a href="index.html" class="px-4 py-2 bg-emerald-900 hover:bg-emerald-950 border border-emerald-600 rounded-xl text-xs font-bold shadow-sm transition-all">
                    ← Zurück
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto p-4 max-w-7xl space-y-6">

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Linke Spalte: Google Kalender Live-Einbindung -->
            <div class="bg-gray-800 p-5 rounded-2xl shadow-md border border-gray-700 space-y-4 lg:col-span-1 flex flex-col">
                <h3 class="font-bold text-base text-white border-b border-gray-700 pb-2">🌐 Google Kalender</h3>
                <p class="text-xs text-gray-400">Dein verbundener Google-Kalender:</p>
                <div class="flex-grow min-h-[350px] rounded-xl overflow-hidden border border-gray-700 bg-white">
                    <iframe src="https://calendar.google.com/calendar/embed?src=duhrrom%40gmail.com&ctz=Europe%2FLuxembourg&showTitle=0&showPrint=0&showTabs=0" 
                            style="border:0" width="100%" height="100%" frameborder="0" scrolling="no"></iframe>
                </div>
            </div>

            <!-- Rechter Bereich: Ausgelesene Termine -->
            <div class="space-y-6 lg:col-span-2">
                
                <div class="bg-gray-800 p-5 rounded-2xl shadow-md border border-gray-700 space-y-3">
                    <div class="flex justify-between items-center border-b border-gray-700 pb-2">
                        <h3 class="font-bold text-base text-white">📌 Ausgelesene Termine & Fristen aus allen Tools</h3>
                        <span id="syncStatus" class="text-xs bg-emerald-900/60 text-emerald-300 px-2.5 py-1 rounded-full font-semibold">Verbunden mit Cloud</span>
                    </div>
                    <div id="databaseEventsList" class="space-y-2.5 max-h-[420px] overflow-y-auto pr-1">
                        <p class="text-xs text-gray-500 text-center py-6">Lade Termine aus der Online-Datenbank...</p>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <script>
        const NPOINT_API_BASE = "https://api.npoint.io/";
        const urlParams = new URLSearchParams(window.location.search);
        let hubBinId = urlParams.get('id');
        let aktuelleTermineListe = [];

        document.addEventListener('DOMContentLoaded', async () => {
            if (!hubBinId) {
                hubBinId = localStorage.getItem('active_wg_bin_id');
            }
            await ladeDatenAusCloud();
        });

        async function manuelleSynchronisation() {
            await ladeDatenAusCloud();
        }

        async function ladeDatenAusCloud() {
            if (!hubBinId) {
                document.getElementById('databaseEventsList').innerHTML = `<p class="text-xs text-amber-400 text-center py-6">⚠️ Keine Datenbank-ID gefunden.</p>`;
                return;
            }

            try {
                let response = await fetch(NPOINT_API_BASE + hubBinId);
                if (response.ok) {
                    const cloudObj = await response.json();
                    sammleUndZeigeTermine(cloudObj);
                } else {
                    sammleUndZeigeTermine({
                        events: JSON.parse(localStorage.getItem('wg_events') || '[]'),
                        contracts: JSON.parse(localStorage.getItem('wg_contracts') || '[]'),
                        data: JSON.parse(localStorage.getItem('kassenbon_data') || '[]')
                    });
                }
            } catch (error) {
                sammleUndZeigeTermine({
                    events: JSON.parse(localStorage.getItem('wg_events') || '[]'),
                    contracts: JSON.parse(localStorage.getItem('wg_contracts') || '[]'),
                    data: JSON.parse(localStorage.getItem('kassenbon_data') || '[]')
                });
            }
        }

        function sammleUndZeigeTermine(data) {
            aktuelleTermineListe = [];

            if (data && Array.isArray(data.events)) {
                data.events.forEach(ev => {
                    aktuelleTermineListe.push({
                        titel: ev.title || ev.type,
                        datum: ev.date,
                        kategorie: 'Termin / Slot (' + (ev.type || 'Allgemein') + ')',
                        details: `Gebucht von: ${ev.owner || 'WG'} ${ev.timeStart ? '| ' + ev.timeStart : ''}`,
                        farbe: 'text-emerald-400 bg-emerald-950'
                    });
                });
            }

            if (data && Array.isArray(data.contracts)) {
                data.contracts.forEach(c => {
                    if (c.noticeDate) {
                        aktuelleTermineListe.push({
                            titel: `Kündigungsfrist: ${c.name}`,
                            datum: c.noticeDate,
                            kategorie: 'Vertrag / Abo',
                            details: `Kosten: ${c.price.toFixed(2)} € | Zahler: ${c.payer}`,
                            farbe: 'text-purple-400 bg-purple-950'
                        });
                    }
                });
            }

            if (data && Array.isArray(data.data)) {
                data.data.forEach(r => {
                    if (r.date) {
                        aktuelleTermineListe.push({
                            titel: `Buchung: ${r.title}`,
                            datum: r.date,
                            kategorie: 'Finanzen / Kassenbon',
                            details: `Betrag: ${r.price.toFixed(2)} € | ${r.payer}`,
                            farbe: 'text-blue-400 bg-blue-950'
                        });
                    }
                });
            }

            aktuelleTermineListe.sort((a, b) => new Date(a.datum) - new Date(b.datum));

            const container = document.getElementById('databaseEventsList');
            if (aktuelleTermineListe.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500 text-center py-6">Keine Termine oder Fristen in den Datenbank-Tools gefunden.</p>`;
                return;
            }

            container.innerHTML = aktuelleTermineListe.map(item => `
                <div class="p-3 bg-gray-900 border border-gray-700 rounded-xl flex justify-between items-center text-xs">
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${item.farbe}">${item.kategorie}</span>
                            <span class="font-bold text-white text-sm">${item.titel}</span>
                        </div>
                        <p class="text-gray-400 text-[11px] mt-1">📅 ${item.datum} | ${item.details}</p>
                    </div>
                </div>
            `).join('');
        }

        // ICS-Export Funktion für Google Kalender Import
        function exportiereAlsICS() {
            if (aktuelleTermineListe.length === 0) {
                alert("Keine Termine zum Exportieren vorhanden.");
                return;
            }

            let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Helferlein Hub//DE\n";

            aktuelleTermineListe.forEach((item, index) => {
                const cleanDate = item.datum.replace(/-/g, '');
                icsContent += "BEGIN:VEVENT\n";
                icsContent += `UID:helferlein-${index}-${cleanDate}@hub\n`;
                icsContent += `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z\n`;
                icsContent += `DTSTART;VALUE=DATE:${cleanDate}\n`;
                icsContent += `SUMMARY:${item.titel}\n`;
                icsContent += `DESCRIPTION:${item.kategorie} - ${item.details}\n`;
                icsContent += "END:VEVENT\n";
            });

            icsContent += "END:VCALENDAR";

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', 'helferlein-termine.ics');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            alert("📥 ICS-Datei heruntergeladen! Du kannst sie jetzt in Google Kalender importieren (unter Einstellungen -> Importieren & Exportieren).");
        }
    </script>
</body>
</html>
