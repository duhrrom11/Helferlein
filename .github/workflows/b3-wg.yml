name: B3 WG pilot
on:
  pull_request:
    paths:
      - 'assets/helferlein-b3*'
      - 'tools/wg-organisator/index.html'
      - 'tests/b3-wg*'
      - '.github/workflows/b3-wg.yml'
  push:
    branches: ['design-b3-rollout-wg-organisator']
    paths:
      - 'assets/helferlein-b3*'
      - 'tools/wg-organisator/index.html'
      - 'tests/b3-wg*'
      - '.github/workflows/b3-wg.yml'
permissions:
  contents: read
jobs:
  wg-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Static data contract checks
        run: node --test tests/b3-wg.test.cjs
      - name: Install browser tooling
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Run local static server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/b3-wg.log 2>&1 &
      - name: Check real browser layouts
        run: npx playwright test tests/b3-wg.spec.cjs --reporter=line --workers=1
