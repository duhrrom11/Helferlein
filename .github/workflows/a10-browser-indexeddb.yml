name: A10 isolated real-browser IndexedDB tests

on:
  pull_request:
    paths:
      - 'assets/a10-atomic-idb-store.js'
      - 'assets/a10-v1-portable-backup.js'
      - 'assets/a10-historical-v1-normalizer.js'
      - 'assets/a10-v1-backup-transfer.js'
      - 'assets/a10-atomic-import-reservation.js'
      - 'assets/a10-preview-bound-reservation.js'
      - 'assets/a10-reservation-recovery.js'
      - 'assets/a10-orphan-cleanup.js'
      - 'assets/a10-simulated-import-commit.js'
      - 'tests/a10-browser-indexeddb.cjs'
      - 'tests/a10-browser-persistent-restart.cjs'
      - 'tests/a10-browser-hardkill.cjs'
      - 'tests/a10-browser-quota-faults.cjs'
      - 'tests/a10-browser-portable-v1-backup.cjs'
      - 'tests/a10-browser-v1-schema-contract.cjs'
      - 'tests/a10-browser-historical-v1.cjs'
      - 'tests/a10-browser-backup-transfer.cjs'
      - 'tests/a10-browser-import-reservation-race.cjs'
      - 'tests/a10-browser-preview-bound-reservation.cjs'
      - 'tests/a10-browser-reservation-recovery.cjs'
      - 'tests/a10-browser-orphan-cleanup.cjs'
      - 'tests/a10-browser-simulated-import-commit.cjs'
      - 'assets/heir-owner-legacy.js'
      - '.github/workflows/a10-browser-indexeddb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-idb:
    name: Real Chromium IndexedDB
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real IndexedDB tests against localhost only
        run: |
          node tests/a10-browser-indexeddb.cjs
          node tests/a10-browser-persistent-restart.cjs
          node tests/a10-browser-hardkill.cjs
          node tests/a10-browser-quota-faults.cjs
          node tests/a10-browser-portable-v1-backup.cjs
          node tests/a10-browser-v1-schema-contract.cjs
          node tests/a10-browser-historical-v1.cjs
          node tests/a10-browser-backup-transfer.cjs
          node tests/a10-browser-import-reservation-race.cjs
          node tests/a10-browser-preview-bound-reservation.cjs
          node tests/a10-browser-reservation-recovery.cjs
          node tests/a10-browser-orphan-cleanup.cjs
          node tests/a10-browser-simulated-import-commit.cjs
