name: Vault API smoke offline safety
on:
  pull_request:
    paths:
      - tests/vault-api-smoke.cjs
      - tests/vault-api-smoke-offline.test.cjs
      - .github/workflows/vault-smoke-offline.yml
  push:
    branches: [main]
    paths:
      - tests/vault-api-smoke.cjs
      - tests/vault-api-smoke-offline.test.cjs
      - .github/workflows/vault-smoke-offline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate scripts
        run: |
          node --check tests/vault-api-smoke.cjs
          node --check tests/vault-api-smoke-offline.test.cjs
      - name: Run offline-only safety tests
        run: node --test tests/vault-api-smoke-offline.test.cjs
