name: Phase 1 security regression
on:
  pull_request:
    paths:
      - 'tools/**/index.html'
      - 'assets/helferlein-safe-output.js'
      - 'tests/security-phase1*'
      - '.github/workflows/security-phase1.yml'
  push:
    branches: ['security-phase1-data-isolation']
permissions:
  contents: read
jobs:
  isolation-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check WG namespace and safe output
        run: node --test tests/security-phase1.test.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve static site locally
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/security-phase1.log 2>&1 &
      - name: Browser regression, no database writes
        run: npx playwright test tests/security-phase1.spec.cjs --reporter=line --workers=1
