name: B3 Backform pilot
on:
  pull_request:
    paths:
      - 'assets/helferlein-b3*'
      - 'tools/backform-umrechner/index.html'
      - 'tests/b3-backform*'
      - '.github/workflows/b3-backform.yml'
  push:
    branches: ['design-b3-rollout-backform']
    paths:
      - 'assets/helferlein-b3*'
      - 'tools/backform-umrechner/index.html'
      - 'tests/b3-backform*'
      - '.github/workflows/b3-backform.yml'
permissions:
  contents: read
jobs:
  backform-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original recipe and UI data contracts
        run: node --test tests/b3-backform.test.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static preview server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/b3-backform.log 2>&1 &
      - name: Verify responsive interface and original scaling formula
        run: npx playwright test tests/b3-backform.spec.cjs --reporter=line --workers=1
