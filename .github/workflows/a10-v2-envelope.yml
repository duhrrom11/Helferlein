name: A10 isolated V2 encryption contract

on:
  pull_request:
    paths:
      - 'assets/a10-v2-encrypted-envelope.js'
      - 'tests/a10-v2-envelope.cjs'
      - '.github/workflows/a10-v2-envelope.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envelope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V2 encryption and unlock (isolated, synthetic only)
        run: node tests/a10-v2-envelope.cjs
