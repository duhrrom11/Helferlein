name: Backup security policy
on:
  pull_request:
    paths:
      - index.html
      - tests/backup-policy.test.cjs
      - .github/workflows/backup-policy.yml
  push:
    branches: [main]
    paths:
      - index.html
      - tests/backup-policy.test.cjs
      - .github/workflows/backup-policy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check backup allowlist and import/export guards
        run: node tests/backup-policy.test.cjs
