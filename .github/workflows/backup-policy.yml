name: Backup-Sicherheitsregression

on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/backup-key-policy.test.cjs'
      - '.github/workflows/backup-policy.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/backup-key-policy.test.cjs'
      - '.github/workflows/backup-policy.yml'

permissions:
  contents: read

jobs:
  backup-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Backup-Schlüsselrichtlinie prüfen
        run: node tests/backup-key-policy.test.cjs
