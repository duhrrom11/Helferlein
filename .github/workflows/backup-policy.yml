name: Backup security policy
on:
  pull_request:
    paths:
      - index.html
      - tests/backup-policy.test.cjs
      - .github/workflows/backup-policy.yml
  push:
    branches: [main]
    paths:
      - index.html
      - tests/backup-policy.test.cjs
      - .github/workflows/backup-policy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (verified tag)
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (verified tag)
        with:
          node-version: '22'
      - name: Check backup allowlist and import/export guards
        run: node tests/backup-policy.test.cjs
