name: Live GitHub Pages HTTP check
on:
  workflow_dispatch:
  deployment_status:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  live-site:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'github-pages')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify published routes over HTTPS
        env:
          SITE: https://duhrrom11.github.io/Helferlein
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error, sys, re, pathlib, html
          base = os.environ['SITE'].rstrip('/')
          routes = ['/', '/index.html', '/datenschutz.html', '/impressum.html',
                    '/amazon-wishlist/index.html', '/amazon-wishlist/app.mjs', '/amazon-wishlist/lists-dashboard.mjs',
                    '/tools/notizen/index.html', '/tools/verleih/index.html',
                    '/tools/wg-kasse/index.html']
          homepage = pathlib.Path('index.html').read_text(encoding='utf-8')
          tool_routes = sorted(set('/' + html.unescape(p) for p in re.findall(r'href="(tools/[^"]+\.html)"', homepage)))
          # Auch Tools mit Umlauten und abweichenden Dateinamen pruefen.
          if len(tool_routes) < 11:
              print(f'FAIL: only {len(tool_routes)} tool routes found in homepage', file=sys.stderr)
              sys.exit(1)
          routes = sorted(set(routes + tool_routes))
          failed = []
          for route in routes:
              url = base + urllib.parse.quote(route, safe='/')
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'Helferlein-live-smoke/1.0'})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      body = response.read(300000).decode('utf-8', errors='replace')
                      status = response.status
                      ok = status == 200 and (('<html' in body.lower() and '<title' in body.lower()) if route.endswith('.html') or route == '/' else ('mountListsDashboard' in body if route.endswith('lists-dashboard.mjs') else "from './lists-dashboard.mjs'" in body))
                      print(f"{'OK' if ok else 'FAIL'} {status} {url}")
                      if not ok: failed.append(url)
              except (urllib.error.URLError, TimeoutError) as exc:
                  print(f"FAIL {url}: {exc}")
                  failed.append(url)
          if failed:
              print(f"{len(failed)} live route(s) failed", file=sys.stderr)
              sys.exit(1)
          print(f"All {len(routes)} public routes are accessible")
          PY

