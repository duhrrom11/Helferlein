name: Toolya isolated tests
on:
  push:
    branches: [feature/toolya-buddy-wishlist-v4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Component, integration and isolated app mocks
        run: node --experimental-vm-modules --test tools/wishlist/toolya-buddy.test.mjs tools/wishlist/wishlist-buddy-integration.test.mjs tools/wishlist/wish-save-outcome.test.mjs tools/wishlist/wishlist-app-mock.test.mjs
