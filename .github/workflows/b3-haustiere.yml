name: B3 Haustier-Gesundheitspass pilot
on:
  pull_request:
    paths:
      - 'assets/helferlein-b3*'
      - 'tools/haustier-gesundheitspass/index.html'
      - 'tests/b3-haustiere*'
      - '.github/workflows/b3-haustiere.yml'
  push:
    branches: ['design-b3-rollout-haustiere']
    paths:
      - 'assets/helferlein-b3*'
      - 'tools/haustier-gesundheitspass/index.html'
      - 'tests/b3-haustiere*'
      - '.github/workflows/b3-haustiere.yml'
permissions:
  contents: read
jobs:
  haustiere-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Existing medical records and B3 static regression
        run: node --test tests/b3-haustiere.test.cjs
      - name: Install Chromium browser
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static preview server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/b3-haustiere.log 2>&1 &
      - name: Verify mobile tablet and desktop layout
        run: npx playwright test tests/b3-haustiere.spec.cjs --reporter=line --workers=1
