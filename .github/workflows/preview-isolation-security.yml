name: Preview and local-data isolation security
on:
  pull_request:
    paths:
      - 'tools/notizen/vertrauenspersonen.html'
      - 'tools/notizen/vertrauensperson-erstellen.html'
      - 'tools/notizen/vertrauensperson-einladung.html'
      - 'tools/notizen/vertrauenspersonen-verwaltung.html'
      - 'supabase/functions/_shared/trusted-person-invitation-api.ts'
      - 'tools/wg-organisator/index.html'
      - 'tools/haushaltsbuch-kassenbon/index.html'
      - 'tests/trusted-person-preview-security.test.cjs'
      - 'tests/wg-haushaltsbuch-isolation.test.cjs'
      - '.github/workflows/preview-isolation-security.yml'
  push:
    branches: [main]
    paths:
      - 'tools/notizen/vertrauenspersonen.html'
      - 'tools/notizen/vertrauensperson-erstellen.html'
      - 'tools/notizen/vertrauensperson-einladung.html'
      - 'tools/notizen/vertrauenspersonen-verwaltung.html'
      - 'supabase/functions/_shared/trusted-person-invitation-api.ts'
      - 'tools/wg-organisator/index.html'
      - 'tools/haushaltsbuch-kassenbon/index.html'
      - 'tests/trusted-person-preview-security.test.cjs'
      - 'tests/wg-haushaltsbuch-isolation.test.cjs'
      - '.github/workflows/preview-isolation-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run focused offline security checks
        run: node --test tests/trusted-person-preview-security.test.cjs tests/wg-haushaltsbuch-isolation.test.cjs
