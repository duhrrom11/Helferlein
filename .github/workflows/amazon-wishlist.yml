name: Amazon wishlist checks
on:
  pull_request:
    paths:
      - 'amazon-wishlist/**'
      - '.github/workflows/amazon-wishlist.yml'
  push:
    branches: ['feature/amazon-wishlist-foundation']
    paths:
      - 'amazon-wishlist/**'
      - '.github/workflows/amazon-wishlist.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check amazon-wishlist/app.mjs
      - run: node --check amazon-wishlist/amazon-links.mjs
      - run: node --check amazon-wishlist/wishlist-utils.mjs
      - run: node --check amazon-wishlist/lists-dashboard.mjs
      - run: node --check amazon-wishlist/list-features.mjs
      - run: node --check amazon-wishlist/bulk-helpers.mjs
      - name: Node tests — amazon-links
        run: node --test amazon-wishlist/amazon-links.test.mjs
      - name: Node tests — bulk-helpers
        run: node --test amazon-wishlist/bulk-helpers.test.mjs
      - name: Node tests — bulk-workflows
        run: node --test amazon-wishlist/bulk-workflows.test.mjs
      - name: Node tests — isolated-browser-fixture
        run: node --test amazon-wishlist/isolated-browser-fixture.test.mjs
      - name: Node tests — security-source
        run: node --test amazon-wishlist/security-source.test.mjs
      - name: Node tests — wishlist-utils
        run: node --test amazon-wishlist/wishlist-utils.test.mjs
