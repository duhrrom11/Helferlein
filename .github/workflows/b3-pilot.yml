name: B3 pilot UI checks
on:
  pull_request:
    paths:
      - 'assets/helferlein-b3.css'
      - 'assets/helferlein-b3.js'
      - 'tools/pflanzenpflege-giessplan/index.html'
      - 'tests/b3-pilot.test.cjs'
      - 'tests/b3-responsive.spec.cjs'
      - '.github/workflows/b3-pilot.yml'
  push:
    paths:
      - 'assets/helferlein-b3.css'
      - 'assets/helferlein-b3.js'
      - 'tools/pflanzenpflege-giessplan/index.html'
      - 'tests/b3-pilot.test.cjs'
      - '.github/workflows/b3-pilot.yml'
jobs:
  ui-regression:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check B3 pilot invariants
        run: node --test tests/b3-pilot.test.cjs
      - name: Install browser tooling
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/b3-server.log 2>&1 &
      - name: Verify responsive layouts in real browser
        run: npx playwright test tests/b3-responsive.spec.cjs --reporter=line --workers=1
