name: Release smoke checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/release-smoke.cjs
      - run: node tests/wg-cache-regression.cjs
      - run: node tests/household-csv-regression.cjs
      - run: node tests/household-backup-regression.cjs
      - run: node tests/household-render-regression.cjs
      - run: node tests/household-ics-regression.cjs
      - run: node tests/household-storage-regression.cjs
      - run: node tests/household-warranty-regression.cjs
