name: Release smoke checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (resolved 2026-11-09)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (resolved 2026-11-09)
        with:
          node-version: '22'
      - run: node scripts/release-smoke.cjs
      - name: Run all 16 regression checks and report failures together
        run: |
          node --check scripts/run-regressions.cjs
          node --check tests/regression-runner-guardrails.cjs
          node tests/regression-runner-guardrails.cjs
          node scripts/run-regressions.cjs
