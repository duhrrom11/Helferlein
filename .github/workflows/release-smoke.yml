name: Release smoke checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (resolved 2026-11-09)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (resolved 2026-11-09)
        with:
          node-version: '22'
      - run: node scripts/release-smoke.cjs
      - run: node tests/wg-cache-regression.cjs
      - run: node tests/household-csv-regression.cjs
      - run: node tests/household-backup-regression.cjs
      - run: node tests/household-render-regression.cjs
      - run: node tests/household-ics-regression.cjs
      - run: node tests/household-storage-regression.cjs
      - run: node tests/household-warranty-regression.cjs
      - run: node tests/household-date-regression.cjs
      - run: node tests/household-photo-removal-regression.cjs
      - run: node tests/household-ocr-regression.cjs
      - run: node tests/household-photo-validation-regression.cjs
      - run: node tests/household-receipt-id-regression.cjs
      - run: node tests/household-ocr-total-regression.cjs
      - run: node tests/household-pdf-summary-regression.cjs
      - run: node tests/household-all-csv-regression.cjs
      - run: node tests/household-duplicate-regression.cjs
