name: Vault Sync Queue Tests

on:
  push:
    paths:
      - 'tools/notizen/index.html'
      - 'tools/digitaler-nachlass/index.html'
      - 'tests/vault-sync-queue.test.cjs'
      - 'tests/vault-local-save.test.cjs'
      - 'tests/vault-config-update.test.cjs'
      - 'tests/vault-alarm-contacts.test.cjs'
      - 'tests/vault-entries-checkin.test.cjs'
      - 'tests/vault-local-failure.test.cjs'
      - 'tests/vault-entry-failure.test.cjs'
      - 'tests/vault-entry-rollback.test.cjs'
      - 'tests/vault-api-security.test.cjs'
      - 'supabase/functions/vault-api/index.ts'
      - '.github/workflows/vault-sync-tests.yml'
  pull_request:
    paths:
      - 'tools/notizen/index.html'
      - 'tools/digitaler-nachlass/index.html'
      - 'tests/vault-sync-queue.test.cjs'
      - 'tests/vault-local-save.test.cjs'
      - 'tests/vault-config-update.test.cjs'
      - 'tests/vault-alarm-contacts.test.cjs'
      - 'tests/vault-entries-checkin.test.cjs'
      - 'tests/vault-local-failure.test.cjs'
      - 'tests/vault-entry-failure.test.cjs'
      - 'tests/vault-entry-rollback.test.cjs'
      - 'tests/vault-api-security.test.cjs'
      - 'supabase/functions/vault-api/index.ts'
      - '.github/workflows/vault-sync-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vault-sync-queue:
    name: Test vault sync queue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated queue tests
        run: node --test tests/vault-sync-queue.test.cjs tests/vault-local-save.test.cjs tests/vault-config-update.test.cjs tests/vault-alarm-contacts.test.cjs tests/vault-entries-checkin.test.cjs tests/vault-local-failure.test.cjs tests/vault-entry-failure.test.cjs tests/vault-entry-rollback.test.cjs tests/vault-api-security.test.cjs
