name: B3 Nachlass pilot
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/helferlein-b3*'
      - 'tools/digitaler-nachlass/index.html'
      - 'tools/digitaler-nachlass/erben.html'
      - 'tests/b3-nachlass*'
      - 'tests/nachlass-release-policy-v2.test.cjs'
      - 'tools/digitaler-nachlass/release-policy-v2.cjs'
      - 'tools/digitaler-nachlass/server-api-v2.cjs'
      - 'tools/digitaler-nachlass/server-auth-v2.cjs'
      - 'tests/nachlass-server-auth-v2.test.cjs'
      - 'tests/nachlass-supabase-heir-access-v2.test.cjs'
      - 'tests/nachlass-supabase-auth-adapter-v2.test.cjs'
      - 'tests/nachlass-rls-draft-contract-v2.test.cjs'
      - 'docs/nachlass-v2-rls-policy-draft.sql'
      - 'tools/digitaler-nachlass/supabase-auth-adapter-v2.cjs'
      - 'tools/digitaler-nachlass/supabase-heir-access-v2.cjs'
      - 'tests/nachlass-server-api-v2.test.cjs'
      - 'tools/digitaler-nachlass/migration-preflight-v2.cjs'
      - 'tests/nachlass-migration-preflight-v2.test.cjs'
      - 'tools/digitaler-nachlass/key-envelope-contract-v2.cjs'
      - 'tests/nachlass-key-envelope-contract-v2.test.cjs'
      - 'tools/digitaler-nachlass/recovery-offline-v2.cjs'
      - 'tests/nachlass-recovery-offline-v2.test.cjs'
      - 'tools/digitaler-nachlass/hpke-offline-v2.cjs'
      - 'tests/nachlass-hpke-offline-v2.test.cjs'
      - 'docs/nachlass-v2-key-envelope-recovery.md'
      - 'docs/nachlass-v2-migration-runbook.md'
      - 'docs/nachlass-cloud-freigabe-v2.md'
      - 'docs/nachlass-server-vertrag-v2.md'
      - '.github/workflows/b3-nachlass.yml'
  push:
    branches: ['main', 'design-b3-rollout-nachlass']
    paths:
      - 'assets/helferlein-b3*'
      - 'tools/digitaler-nachlass/index.html'
      - 'tools/digitaler-nachlass/erben.html'
      - 'tests/b3-nachlass*'
      - 'tests/nachlass-release-policy-v2.test.cjs'
      - 'tools/digitaler-nachlass/release-policy-v2.cjs'
      - 'tools/digitaler-nachlass/server-api-v2.cjs'
      - 'tools/digitaler-nachlass/server-auth-v2.cjs'
      - 'tests/nachlass-server-auth-v2.test.cjs'
      - 'tests/nachlass-supabase-heir-access-v2.test.cjs'
      - 'tests/nachlass-supabase-auth-adapter-v2.test.cjs'
      - 'tests/nachlass-rls-draft-contract-v2.test.cjs'
      - 'docs/nachlass-v2-rls-policy-draft.sql'
      - 'tools/digitaler-nachlass/supabase-auth-adapter-v2.cjs'
      - 'tools/digitaler-nachlass/supabase-heir-access-v2.cjs'
      - 'tests/nachlass-server-api-v2.test.cjs'
      - 'tools/digitaler-nachlass/migration-preflight-v2.cjs'
      - 'tests/nachlass-migration-preflight-v2.test.cjs'
      - 'tools/digitaler-nachlass/key-envelope-contract-v2.cjs'
      - 'tests/nachlass-key-envelope-contract-v2.test.cjs'
      - 'tools/digitaler-nachlass/recovery-offline-v2.cjs'
      - 'tests/nachlass-recovery-offline-v2.test.cjs'
      - 'tools/digitaler-nachlass/hpke-offline-v2.cjs'
      - 'tests/nachlass-hpke-offline-v2.test.cjs'
      - 'docs/nachlass-v2-key-envelope-recovery.md'
      - 'docs/nachlass-v2-migration-runbook.md'
      - 'docs/nachlass-cloud-freigabe-v2.md'
      - 'docs/nachlass-server-vertrag-v2.md'
      - '.github/workflows/b3-nachlass.yml'
permissions:
  contents: read
jobs:
  nachlass-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preserved security notice and vault contract
        run: |
          set -o pipefail
          node --test tests/b3-nachlass.test.cjs tests/nachlass-release-policy-v2.test.cjs tests/nachlass-server-api-v2.test.cjs tests/nachlass-server-auth-v2.test.cjs tests/nachlass-migration-preflight-v2.test.cjs tests/nachlass-key-envelope-contract-v2.test.cjs tests/nachlass-recovery-offline-v2.test.cjs tests/nachlass-hpke-offline-v2.test.cjs tests/nachlass-supabase-heir-access-v2.test.cjs tests/nachlass-supabase-auth-adapter-v2.test.cjs tests/nachlass-rls-draft-contract-v2.test.cjs | tee /tmp/nachlass-node-tests.tap
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local static site
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/b3-nachlass.log 2>&1 &
      - name: Verify browser views without writing test data
        run: |
          set -o pipefail
          npx playwright test tests/b3-nachlass.spec.cjs --reporter=line --workers=1 | tee /tmp/nachlass-browser-tests.log
      - name: Preserve Nachlass test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nachlass-test-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            /tmp/nachlass-node-tests.tap
            /tmp/nachlass-browser-tests.log
            /tmp/b3-nachlass.log
            test-results/
