name: B3 Nachlass pilot
on:
  pull_request:
    paths:
      - 'assets/helferlein-b3*'
      - 'tools/digitaler-nachlass/index.html'
      - 'tools/digitaler-nachlass/erben.html'
      - 'tests/b3-nachlass*'
      - 'tests/nachlass-release-policy-v2.test.cjs'
      - 'tools/digitaler-nachlass/release-policy-v2.cjs'
      - '.github/workflows/b3-nachlass.yml'
  push:
    branches: ['main', 'design-b3-rollout-nachlass']
    paths:
      - 'assets/helferlein-b3*'
      - 'tools/digitaler-nachlass/index.html'
      - 'tools/digitaler-nachlass/erben.html'
      - 'tests/b3-nachlass*'
      - 'tests/nachlass-release-policy-v2.test.cjs'
      - 'tools/digitaler-nachlass/release-policy-v2.cjs'
      - '.github/workflows/b3-nachlass.yml'
permissions:
  contents: read
jobs:
  nachlass-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preserved security notice and vault contract
        run: node --test tests/b3-nachlass.test.cjs tests/nachlass-release-policy-v2.test.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local static site
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/b3-nachlass.log 2>&1 &
      - name: Verify browser views without writing test data
        run: npx playwright test tests/b3-nachlass.spec.cjs --reporter=line --workers=1
