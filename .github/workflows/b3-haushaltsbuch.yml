name: B3 Haushaltsbuch pilot
on:
  pull_request:
    paths:
      - 'assets/helferlein-b3*'
      - 'tools/haushaltsbuch-kassenbon/index.html'
      - 'tests/b3-haushaltsbuch*'
      - '.github/workflows/b3-haushaltsbuch.yml'
  push:
    branches: ['design-b3-rollout-haushaltsbuch']
    paths:
      - 'assets/helferlein-b3*'
      - 'tools/haushaltsbuch-kassenbon/index.html'
      - 'tests/b3-haushaltsbuch*'
      - '.github/workflows/b3-haushaltsbuch.yml'
permissions:
  contents: read
jobs:
  haushaltsbuch-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static data preservation and layout
        run: node --test tests/b3-haushaltsbuch.test.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static site
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/helferlein-b3-haushaltsbuch.log 2>&1 &
      - name: Real browser responsive UI
        run: npx playwright test tests/b3-haushaltsbuch.spec.cjs --reporter=line --workers=1
