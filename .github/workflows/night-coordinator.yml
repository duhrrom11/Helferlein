name: Helferlein Nachtbetrieb

on:
  # UTC schedule: every five minutes, around the clock.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: helferlein-night-coordinator
  cancel-in-progress: false

jobs:
  night-coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate coordinator syntax and safety guardrails
        run: |
          node --check scripts/night-coordinator.cjs
          node --check scripts/night-coordinator-guardrails.cjs
          node scripts/night-coordinator-guardrails.cjs
      - name: Read-only continuous check and checkpoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/night-coordinator.cjs
