name: Helferlein Nachtschicht – reines Audit

on:
  # Daily at 05:00 UTC; report is informational only.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: helferlein-night-coordinator
  cancel-in-progress: false

jobs:
  night-coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate audit script syntax
        run: node --check scripts/night-audit.cjs
      - name: Read-only branch, page, release and work audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/night-audit.cjs
