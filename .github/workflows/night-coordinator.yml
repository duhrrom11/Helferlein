name: Helferlein Nachtbetrieb

on:
  # GitHub schedules use UTC. Run frequently and gate by Europe/Berlin in Node
  # so winter/summer time switches are handled without manual cron changes.
  schedule:
    - cron: '*/5 22-23,0-5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: helferlein-night-coordinator
  cancel-in-progress: false

jobs:
  night-coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read-only night check and checkpoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/night-coordinator.cjs
