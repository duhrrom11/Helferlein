name: Browser launch smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - index.html
      - tools/**
      - tests/browser-smoke.spec.cjs
      - tests/launch-30.spec.cjs
      - .github/workflows/browser-launch-smoke.yml
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (verified tag)
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (verified tag)
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/helferlein-http.log 2>&1 &
      - name: Browser navigation and offline-safe UI smoke
        run: npx playwright test tests/browser-smoke.spec.cjs tests/launch-30.spec.cjs --reporter=line --workers=1
