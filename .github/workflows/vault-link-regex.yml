name: Vault link regex
on:
  pull_request:
    paths:
      - tools/notizen/index.html
      - tests/vault-link-regex.test.cjs
      - .github/workflows/vault-link-regex.yml
  push:
    branches: [main]
    paths:
      - tools/notizen/index.html
      - tests/vault-link-regex.test.cjs
      - .github/workflows/vault-link-regex.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (verified tag)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (verified tag)
        with:
          node-version: '22'
      - run: node tests/vault-link-regex.test.cjs
