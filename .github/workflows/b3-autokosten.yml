name: B3 Autokosten pilot
on:
  pull_request:
    paths:
      - 'assets/helferlein-b3*'
      - 'tools/autokosten-reifenwechsel/index.html'
      - 'tests/b3-autokosten*'
      - '.github/workflows/b3-autokosten.yml'
  push:
    branches: ['design-b3-rollout-autokosten']
    paths:
      - 'assets/helferlein-b3*'
      - 'tools/autokosten-reifenwechsel/index.html'
      - 'tests/b3-autokosten*'
      - '.github/workflows/b3-autokosten.yml'
permissions:
  contents: read
jobs:
  autokosten-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (verified tag)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (verified tag)
        with:
          node-version: '22'
      - name: Static UI/data regression
        run: node --test tests/b3-autokosten.test.cjs
      - name: Install Chromium test browser
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static site
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/helferlein-b3-autokosten.log 2>&1 &
      - name: Test real browser layouts
        run: npx playwright test tests/b3-autokosten.spec.cjs --reporter=line --workers=1
