name: Helferlein OpenAI Agent (read-only pilot)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helferlein-openai-readonly
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate agent syntax
        run: |
          node --check scripts/openai-readonly-agent.cjs
          node --check scripts/openai-readonly-agent-guardrails.cjs
          node scripts/openai-readonly-agent-guardrails.cjs
      - name: Read-only analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: node scripts/openai-readonly-agent.cjs
