name: B3 Parkplatz pilot
on:
  pull_request:
    paths:
      - 'assets/helferlein-b3*'
      - 'tools/parkplatz-merker-parkschein-timer/index.html'
      - 'tests/b3-parkplatz*'
      - '.github/workflows/b3-parkplatz.yml'
  push:
    branches: ['design-b3-rollout-parkplatz']
    paths:
      - 'assets/helferlein-b3*'
      - 'tools/parkplatz-merker-parkschein-timer/index.html'
      - 'tests/b3-parkplatz*'
      - '.github/workflows/b3-parkplatz.yml'
permissions:
  contents: read
jobs:
  parkplatz-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (verified tag)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (verified tag)
        with:
          node-version: '22'
      - name: Static timer and parking preservation tests
        run: node --test tests/b3-parkplatz.test.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static preview
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/b3-parkplatz.log 2>&1 &
      - name: Browser tests across phone tablet desktop
        run: npx playwright test tests/b3-parkplatz.spec.cjs --reporter=line --workers=1
