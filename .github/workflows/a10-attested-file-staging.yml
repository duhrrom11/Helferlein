name: A10 attested backup file staging

on:
  pull_request:
    paths:
      - 'assets/a10-attested-file-staging.js'
      - 'tests/a10-attested-file-staging.cjs'
      - '.github/workflows/a10-attested-file-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attested-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify single-snapshot integrity and recovery-verified inactive staging
        run: node tests/a10-attested-file-staging.cjs
