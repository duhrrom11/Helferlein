name: Production route smoke
on:
  pull_request:
    paths:
      - index.html
      - tools/**
      - tests/production-routes.test.cjs
      - .github/workflows/production-routes.yml
  push:
    branches: [main]
    paths:
      - index.html
      - tools/**
      - tests/production-routes.test.cjs
      - .github/workflows/production-routes.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (verified tag)
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (verified tag)
        with:
          node-version: '22'
      - name: Check homepage links and tool documents
        run: node tests/production-routes.test.cjs
