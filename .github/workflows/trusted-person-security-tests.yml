name: Trusted person security tests (isolated)

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/_shared/**"
      - "supabase/functions/heir-invitations/**"
      - "supabase/functions/heir-redemption/**"
      - "supabase/functions/vault-api/**"
      - "tests/a10-cloud-authorization-source.test.cjs"
      - "supabase/functions/trusted-person-invite-test/**"
      - ".github/workflows/trusted-person-security-tests.yml"
      - "supabase/migrations/**"
      - "supabase/config.toml"
  pull_request:
    paths:
      - "supabase/functions/_shared/**"
      - "supabase/functions/trusted-person-invite-test/**"
      - ".github/workflows/trusted-person-security-tests.yml"

permissions:
  contents: read

# Cancel superseded checks for the same PR; never cancel another branch's job.
concurrency:
  group: trusted-person-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Deno isolated authorization tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check TypeScript types offline
        run: |
          deno check --no-remote supabase/functions/_shared/*.ts
      - name: Type-check staging runtime integration
        run: |
          deno check supabase/functions/trusted-person-invite-test/staging-runtime.ts
          deno check --no-remote supabase/functions/trusted-person-invite-test/index.ts
      - name: Run all isolated security unit tests
        run: |
          deno test --no-remote --no-check supabase/functions/_shared/*_test.ts
      - name: Check Cloud ownership and Edge release-gate source contracts
        run: node --test tests/a10-cloud-authorization-source.test.cjs
