name: A10 isolated encrypted backup file handoff

on:
  pull_request:
    paths:
      - 'assets/a10-backup-file-handoff.js'
      - 'tests/a10-browser-file-handoff.cjs'
      - '.github/workflows/a10-backup-file-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-file-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install isolated Playwright
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test real encrypted file handoff in fresh browser context
        run: node tests/a10-browser-file-handoff.cjs
