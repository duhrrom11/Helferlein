name: Wishes pre-release live hosting reachability
on:
  push:
    branches: [feature/amazon-wishlist-foundation]
    paths:
      - 'amazon-wishlist/**'
      - '.github/workflows/live-host-reachability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe GitHub Pages routes (pre-deployment baseline)
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, sys
          sites = ['https://duhrrom11.github.io/Helferlein']
          paths = ['/', '/amazon-wishlist/index.html']
          errors = []
          for site in sites:
              for path in paths:
                  url = site + path
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Helferlein-pre-release-probe/1.0'})
                      with urllib.request.urlopen(req, timeout=15) as response:
                          status = response.status
                          body = response.read(120000).decode('utf-8', errors='replace')
                          ok = status == 200 and '<html' in body.lower()
                          print(f"{'OK' if ok else 'FAIL'} {status} {url}")
                          if not ok: errors.append(url)
                  except (urllib.error.URLError, TimeoutError) as exc:
                      print(f'FAIL {url}: {exc}')
                      errors.append(url)
          if errors:
              print(f'{len(errors)} existing public routes not reachable; do not infer deployment readiness', file=sys.stderr)
              sys.exit(1)
          print('GitHub Pages serves the existing public HTML routes; this does not prove new code deployed')
          PY
