name: Vault data preservation
on:
  pull_request:
    paths:
      - tools/notizen/index.html
      - tests/vault-fail-closed.test.cjs
      - .github/workflows/vault-preservation.yml
  push:
    branches: [main]
    paths:
      - tools/notizen/index.html
      - tests/vault-fail-closed.test.cjs
      - .github/workflows/vault-preservation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vault-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (verified tag)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (verified tag)
        with:
          node-version: '22'
      - run: node tests/vault-fail-closed.test.cjs
