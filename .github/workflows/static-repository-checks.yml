name: Static repository checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-integrity:
    name: Repository integrity and changed-file syntax
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify repository structure and conflict markers
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -f .nojekyll
          test -f AGENTS.md
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD~1 HEAD
          fi
          if git grep -n -I -E '^(<<<<<<< |=======|>>>>>>> )' -- '*.html' '*.js' '*.css' '*.json' '*.sql' '*.yml' '*.yaml'; then
            echo "::error::Unresolved merge conflict markers found"
            exit 1
          fi
      - name: Validate changed HTML and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            mapfile -d '' changed < <(git diff --name-only --diff-filter=ACMR -z "origin/${{ github.base_ref }}...HEAD" -- '*.html' '*.js' '*.mjs' '*.cjs')
          else
            mapfile -d '' changed < <(git diff --name-only --diff-filter=ACMR -z HEAD~1 HEAD -- '*.html' '*.js' '*.mjs' '*.cjs')
          fi
          python3 scripts/ci/validate_changed_web.py "${changed[@]}"
