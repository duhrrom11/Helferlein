name: Static repository checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify repository structure and conflict markers
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -f .nojekyll
          test -f AGENTS.md
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD~1 HEAD
          fi
          if git grep -n -I -E '^(<<<<<<< |=======|>>>>>>> )' -- '*.html' '*.js' '*.css' '*.json' '*.sql' '*.yml' '*.yaml'; then
            echo "::error::Unresolved merge conflict markers found"
            exit 1
          fi
          echo "Static repository checks passed"
